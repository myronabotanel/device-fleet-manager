<div style="padding: 20px;">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h1>Device Fleet Manager</h1>
    <div>
      <span>Welcome, {{ userName }}!</span>
      <button (click)="logout()" style="margin-left: 10px;">Logout</button>
    </div>
  </div>

  <button (click)="addNew()">+ Add New Device</button>

  <div style="margin-top: 15px; display: flex; gap: 8px;">
    <input 
      [(ngModel)]="searchQuery" 
      placeholder="Search by name, manufacturer, processor, RAM..."
      style="width: 350px; padding: 6px;"
      (keyup.enter)="search()">
    <button (click)="search()">Search</button>
    <button (click)="clearSearch()">Clear</button>
  </div>

  <table border="1" style="width: 100%; margin-top: 20px; border-collapse: collapse;">
    <thead>
      <tr>
        <th>Name</th>
        <th>Manufacturer</th>
        <th>Type</th>
        <th>OS</th>
        <th>RAM</th>
        <th>Assigned To</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let device of devices">
        <td>{{ device.name }}</td>
        <td>{{ device.manufacturer }}</td>
        <td>{{ device.type }}</td>
        <td>{{ device.operatingSystem }}</td>
        <td>{{ device.ramAmount }} GB</td>
        <td>{{ device.userId ? 'Assigned' : 'Free' }}</td>
        <td>
          <button (click)="viewDetail(device.id!)">View</button>
          <button (click)="deleteDevice(device.id!)">Delete</button>
          <button *ngIf="!device.userId" (click)="assignDevice(device.id!)">Assign</button>
          <button *ngIf="device.userId === currentUserId" (click)="unassignDevice(device.id!)">Unassign</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
